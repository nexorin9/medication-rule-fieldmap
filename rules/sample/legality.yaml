layer: 合法性
basis: 处方审核规则体系 §3 特殊药品处方量限（精二药品一般不超过 7 日常量，延长须注明理由）
version: "2026.10"
effective_from: "2026-01-01"
effective_to: null
applies_when:
  rx_type: 门急诊一般
  drug_category: 第二类精神药品
